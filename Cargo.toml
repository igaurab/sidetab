[package]
name = "sidetab"
version = "0.1.1"
edition = "2021"
description = "A Contexts-style window switcher sidebar for Hyprland — fast Alt-Tab panel with fuzzy search and hover reveal"
license = "MIT"
repository = "https://github.com/igaurab/sidetab"
homepage = "https://github.com/igaurab/sidetab"
readme = "README.md"
keywords = ["hyprland", "wayland", "window-switcher", "alt-tab", "gpui"]
categories = ["gui", "command-line-utilities"]

[dependencies]
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fuzzy-matcher = "0.3"
freedesktop-icons = "0.4"
resvg = "0.45"
anyhow = "1"
dirs = "6"
futures = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Full debuginfo on a GPUI binary costs ~500MB of output and dominates link
# time on every edit. Line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Release-speed binary without the slow parts of the release profile, for
# checking real-world performance: cargo build --profile quick
[profile.quick]
inherits = "release"
lto = false
strip = false
debug = "line-tables-only"
