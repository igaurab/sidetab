<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- sidetab application icon: a window-switcher sidebar panel -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26272c"/>
      <stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a86f7"/>
      <stop offset="1" stop-color="#2c6fef"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background, dark slate with a subtle vertical gradient -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- faint inner edge highlight for depth -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="4"/>

  <!-- accent-blue vertical sidebar bar hugging the left edge -->
  <rect x="92" y="116" width="30" height="280" rx="15" fill="url(#bar)"/>

  <!-- window rows: light rounded bars, the second one selected in accent blue -->
  <rect x="162" y="116" width="258" height="52" rx="16" fill="#e9ebef"/>
  <rect x="162" y="192" width="258" height="52" rx="16" fill="#2c6fef"/>
  <rect x="162" y="268" width="258" height="52" rx="16" fill="#e9ebef" fill-opacity="0.75"/>
  <rect x="162" y="344" width="202" height="52" rx="16" fill="#e9ebef" fill-opacity="0.5"/>
</svg>
